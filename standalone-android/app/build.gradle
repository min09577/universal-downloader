apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.chaquo.python'
apply plugin: 'com.google.protobuf'

android {
    namespace 'com.min0777.universaldownloader'
    compileSdk 34

    defaultConfig {
        applicationId 'com.min0777.universaldownloader'
        minSdk 26
        targetSdk 34
        versionCode 36
        versionName 'ai.1.0.21'

        ndk {
            // ffmpeg-kit AAR 含4个ABI, packagingOptions 过滤后 APK 仅含这两个
            abiFilters 'arm64-v8a', 'x86_64'
        }

        packagingOptions {
            jniLibs {
                excludes += ['jni/armeabi-v7a/**', 'jni/x86/**']
            }
        }

        python {
            version '3.12'
            buildPython System.getenv('PYTHON_PATH') ?: 'python3'
            pip {
                install 'yt-dlp'
                install 'requests'
                install 'certifi'
            }
        }
    }

    protobuf {
        protoc {
            artifact = 'com.google.protobuf:protoc:3.25.3'
        }
        plugins {
            grpc {
                artifact = 'io.grpc:protoc-gen-grpc-java:1.60.0'
            }
            grpckt {
                artifact = 'io.grpc:protoc-gen-grpc-kotlin:1.4.1:jdk8@jar'
            }
        }
        generateProtoTasks {
            all().forEach { task ->
                task.builtins {
                    java {
                        option 'lite'
                    }
                }
                task.plugins {
                    grpc {
                        option 'lite'
                    }
                    grpckt {
                        option 'lite'
                    }
                }
            }
        }
    }

    signingConfigs {
        appSign {
            storeFile rootProject.file('../signing/app_sign.jks')
            storePassword 'omnidl2026'
            keyAlias 'universaldownloader'
            keyPassword 'omnidl2026'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.appSign
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.appSign
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation files('libs/ffmpeg-kit-main-16k.aar')
    implementation 'com.arthenica:smart-exception-java:0.2.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.protobuf:protobuf-javalite:3.25.3'
    implementation 'io.grpc:grpc-okhttp:1.60.0'
    implementation 'io.grpc:grpc-protobuf-lite:1.60.0'
    implementation 'io.grpc:grpc-stub:1.60.0'
    implementation 'io.grpc:grpc-kotlin-stub:1.4.1'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
}
