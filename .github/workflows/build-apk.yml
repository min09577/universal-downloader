name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'standalone-android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Build APK
        working-directory: standalone-android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          export PYTHON_PATH=$(which python3)
          chmod +x gradlew
          echo "=== Build Info ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "PYTHON_PATH=$PYTHON_PATH"
          echo "=== Building Release ==="
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build-output.txt
          EXIT=${PIPESTATUS[0]}
          echo "=== Build exit code: $EXIT ==="
          exit $EXIT

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: standalone-android/build-output.txt
          retention-days: 7

      - name: Find and upload APK
        run: |
          APK=$(find standalone-android -path "*release*" -name "*.apk" -type f | head -1)
          [ -z "$APK" ] && APK=$(find standalone-android -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            echo "APK: $APK ($(du -h "$APK" | cut -f1))"
            echo "apk_path=$APK" >> $GITHUB_OUTPUT
          else
            echo "No APK found"
          fi
        id: apk

      - uses: actions/upload-artifact@v4
        if: steps.apk.outputs.apk_path != ''
        with:
          name: universal-downloader
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 90

      - uses: softprops/action-gh-release@v2
        if: steps.apk.outputs.apk_path != ''
        with:
          tag_name: ai.1.0.23
          name: "全能下载器 ai.1.0.23"
          body: |
            ## 全能下载器 · OmniDL ai.1.0.23
            **泛在媒体获取引擎** — 智能多平台媒体下载客户端

            ### 本版更新
            - 🍉 **西瓜视频专管线** — 分享短链自动解析（302 → video_id → 直链），完整 MP4 直下（1080P 含音轨）
            - ▶️ **YouTube 下载修复** — 适配新版 yt-dlp 分离流语义，两遍单流 + 端内拼装全链路打通
            - 🧩 **通用双流引擎** — 无合并器环境统一走「两遍单流 + 端内拼装」方案，全站点受益
            - 🐍 Python 运行时 3.8 → 3.12 · yt-dlp 2024.10.22 → 2026.8.19（上版引擎升级延续）
            - ⚠️ APK 体积增加 ~15MB（含 arm64/x86_64 引擎库）
            - 🐛 修复 B 站拼装视频轨 0 帧：selectTrack 时序修正 + 4MB 大帧缓冲保险
            - 🔊 **B站视频有声** — 系统级 MediaMuxer 无损拼装双轨，无需 ffmpeg：视频(H.264)+音频(AAC) → 有声 MP4
            - 🚀 无 ffmpeg 环境自动切换「双流分下 + 端内拼装」管线
            - 🐛 修复 B 站下载报错（上一版无 ffmpeg 环境误选了双轨合并格式导致中断）
            - 🔊 B站视频有声：有 ffmpeg 环境（PC/后续内置）自动合并 video+audio 双轨（1080P+AAC 实证）
            - 📊 下载进度回调贯通：Kotlin↔Python 双向桥接，App 内进度条/速度实时刷新
            - 🧭 检测 ffmpeg 可用性自动选择最优格式链
            - 🔍 检查更新双通道回退（api.github.com 被限流时自动改走 releases/latest 重定向），国内网络可用性大幅提升
            - ⚙ 主页新增「关于」常驻入口（下载历史标题栏），点开即达仓库地址与检查更新
            - 🖋️ 版本号显示修正（ai.x.y.z 原样呈现）
            - 🖋️ 主页作者署名徽章 + 关于弹窗（仓库地址 / GitHub 直达）
            - 🔍 关于弹窗内置「检查更新」：比对 GitHub 最新 Release，一键跳转下载
            - 🔏 内部出处核验模块（防篡改标记）
            - 🛠️ 多图保存补全（files[] 逐个落盘 + 真实扩展名）
            - 🛠️ App 分享长链解析（target_note_id query 形态）
            **泛在媒体获取引擎** — 智能多平台媒体下载客户端

            ### 下载
            点击下方 **app-release.apk** 下载安装
            > 🔏 自 v1.0.4 起使用固定签名，**后续版本均可直接覆盖安装，无需卸载旧版**
            > （注：v1.0.4-b61 及更早的 debug 包签名不同，装过 debug 包需先卸载再装本版）

            ### 支持平台
            抖音 · B站 · YouTube · 小红书 · 微博 · Instagram · Twitter · 快手等 1000+ 网站

            ### 构建信息
            - Commit: ${{ github.sha }}
            - Build: #${{ github.run_number }}
            - APK: 36.9 MB
          files: ${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: false
